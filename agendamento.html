<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>

    <main>
        <h2>Agende sua consulta</h2>
        <form action="#" method="post" id="formulario">
            <label for="nome">Nome Completo: </label>
            <input type="text" name="nome" id="nome" required class="form"> <br>

            <label for="email">Email: </label>
            <input type="email" name="email" id="email" class="form"> <br>

            <label for="telefone">Telefone: </label>
            <input  class="form"
                type="tel" 
                name="telefone" 
                id="telefone" 
                required 
                inputmode="numeric"
                maxlength="15"
                pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
                title="Digite com DD. Ex: (17) 98765-4321 ou 17987654321"> <br>

            <label for="data" class="form2">Data: </label>
            <input type="date" name="data" id="data" required class="form3"> <br>

            <label for="hora" class="form2">Horário: </label>
            <input type="time" name="hora" id="hora" required class="form3"> <br>

            <label for="especialidades" class="form2">Especialidade:</label>
            <select name="especialidades" id="especialidades" required class="form3">
                <option value="">Selecione uma opção</option>
                <option value="clinico-geral">Clínico Geral</option>
                <option value="Cardiologia">Cardiologia</option>
                <option value="Dermatologia">Dermatologia</option>
                <option value="Pediatria">Pediatria</option>
            </select>
            <br>
            <label for="mensagem" class="form2">Mensagem: </label>
            <textarea name="mensagem" id="mensagem" rows="4"></textarea>
            <br>
            <button type="submit" class="botton">Confirmar Agendamento</button>
        </form>
    </main>

    <footer>
        <p>
            Clínica Vida Plena - Todos os direitos reservados.
        </p>
    </footer>
</body>

</html>
